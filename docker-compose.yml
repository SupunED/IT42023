version: '3.8'

services:
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=booknest_root_pw
      - MYSQL_DATABASE=booknest_db
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/booknest_schema.sql:/docker-entrypoint-initdb.d/booknest_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pbooknest_root_pw"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=booknest_db
      - DB_USER=root
      - DB_PASSWORD=booknest_root_pw
      - DB_SSL=false
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET to a random value of at least 32 characters}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID to your Google web client ID}
      - APP_ORIGINS=http://localhost:3000,http://localhost:5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
