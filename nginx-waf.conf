# BookNest Azure VM - OWASP ModSecurity WAF Reverse Proxy Configuration
# Place this configuration in /etc/nginx/conf.d/booknest-waf.conf on the Azure VM

server {
    listen 80;
    server_name booknest.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name booknest.yourdomain.com;

    # SSL Certificates (Let's Encrypt / Azure Key Vault Managed)
    ssl_certificate /etc/letsencrypt/live/booknest.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booknest.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ModSecurity Web Application Firewall Configuration
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/include.conf;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Proxy to Azure App Service Web App
    location / {
        proxy_pass https://booknest-app.azurewebsites.net;
        proxy_set_header Host booknest-app.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90;
    }
}
